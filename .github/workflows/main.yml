name: DurabilityAlert – Auto Build & Release with Build Number

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: 16

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.2
        with:
          maven-version: 3.8.1

      - name: Read build number
        id: build_number
        run: |
          BUILD=$(cat build.number)
          echo "BUILD_NUMBER=$BUILD" >> $GITHUB_ENV

      - name: Check if release already exists
        id: check_release
        run: |
          EXISTS=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/build-${{ env.BUILD_NUMBER }} | jq -r '.id // empty')
          if [[ -n "$EXISTS" ]]; then
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Skip if release already exists
        if: env.RELEASE_EXISTS == 'true'
        run: |
          echo "Build #${{ env.BUILD_NUMBER }} already released. Skipping."
          exit 0

      - name: Build project
        run: mvn package -B

      - name: Rename .jar to include build number
        run: |
          mv ./target/DurabilityAlert*.jar ./target/DurabilityAlert-build-${{ env.BUILD_NUMBER }}.jar

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags
          LAST_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --max-count=1) || echo "")
          LOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s")
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$LOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Release ${{ env.BUILD_NUMBER }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
          files: ./target/DurabilityAlert-build-${{ env.BUILD_NUMBER }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Trigger WordPress GitHub Releases Sync
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.WORDPRESS_SYNC_URL }}"

      - name: Notify Discord with file upload
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          filename: ./target/DurabilityAlert-build-${{ env.BUILD_NUMBER }}.jar
          embed-title: "📦 DurabilityAlert - Build #${{ env.BUILD_NUMBER }}"
          embed-description: |
            **Plugin:** DurabilityAlert
            **Build Number:** ${{ env.BUILD_NUMBER }}
            **File:** `DurabilityAlert-build-${{ env.BUILD_NUMBER }}.jar`
            
            ✅ Build completed successfully! Download the .jar file attached below.
          embed-color: 3066993
          embed-thumbnail-url: https://cdn.modrinth.com/data/BgYvyTuF/42db615c53882f97937fafaedcdba747ac8ea4e9_96.webp
          embed-footer-text: "DurabilityAlert • Direct File Upload"
